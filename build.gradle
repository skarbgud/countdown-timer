plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.11'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.timer'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // MyBatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'

    // PostgreSQL JDBC Driver
    runtimeOnly 'org.postgresql:postgresql:42.7.1'

    // Development Tools
    compileOnly 'org.projectlombok:lombok:1.18.34'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Test Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.4'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Spring Boot JAR 플러그인 설정
jar {
    enabled = false
}

bootJar {
    archiveFileName = 'countdown-timer.jar'
    archiveVersion = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Main-Class': 'org.springframework.boot.loader.launch.JarLauncher'
        )
    }
}

if (!project.hasProperty('intellij')) {
    // 프론트엔드 빌드 태스크
    task frontendBuild(type: Exec) {
        workingDir 'src/main/resources/static/frontend'
        commandLine 'npm', 'run', 'build'

        // npm이 설치되어 있는지 확인
        onlyIf {
            file('src/main/resources/static/frontend/package.json').exists()
        }
        
        // 빌드 실패 시에도 계속 진행 (선택사항)
        ignoreExitValue = false
    }

    // 프론트엔드 빌드 결과를 정적 디렉토리로 복사
    task copyFrontendBuild(type: Copy, dependsOn: frontendBuild) {
        from 'src/main/resources/static/frontend/build'
        into 'src/main/resources/static'

        // 기존 정적 파일들 제거 (frontend 디렉토리 제외)
        doFirst {
            delete fileTree('src/main/resources/static') {
                exclude 'frontend/**'
            }
        }
        
        // 빌드 디렉토리가 존재하는지 확인
        onlyIf {
            file('src/main/resources/static/frontend/build').exists()
        }
    }

    // processResources가 copyFrontendBuild에 의존하도록 설정
    processResources.dependsOn copyFrontendBuild

    processResources {
        exclude 'static/frontend/**'
    }
}

// Java 컴파일 최적화 설정
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.incremental = true
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}