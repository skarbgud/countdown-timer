plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.11'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.timer'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

// Gradle JVM 버전 설정
gradle.projectsEvaluated {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // MyBatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'

    // PostgreSQL JDBC Driver
    runtimeOnly 'org.postgresql:postgresql:42.7.1'

    // Development Tools
    compileOnly 'org.projectlombok:lombok:1.18.34'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Test Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Spring Boot JAR 플러그인 설정
jar {
    enabled = false
}

bootJar {
    archiveFileName = 'countdown-timer.jar'
    // JAR 파일 압축 옵션 추가
    archiveVersion = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 메타데이터 최적화
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Main-Class': 'org.springframework.boot.loader.launch.JarLauncher'
        )
    }
}

// 프론트엔드 빌드 태스크
task frontendBuild(type: Exec) {
    workingDir 'src/main/resources/static/frontend'
    commandLine 'npm', 'run', 'build'

    // npm이 설치되어 있는지 확인
    onlyIf {
        file('src/main/resources/static/frontend/package.json').exists()
    }
}

// 프론트엔드 빌드 결과를 정적 디렉토리로 복사
task copyFrontendBuild(type: Copy, dependsOn: frontendBuild) {
    from 'src/main/resources/static/frontend/build'
    into 'src/main/resources/static'

    // 기존 정적 파일들 제거 (build 디렉토리 제외)
    doFirst {
        delete fileTree('src/main/resources/static') {
            exclude 'frontend/**'
            exclude 'build/**'
        }
    }
}

// processResources 태스크가 프론트엔드 빌드에 의존하도록 설정
processResources.dependsOn copyFrontendBuild

// 빌드 최적화
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.incremental = true
}