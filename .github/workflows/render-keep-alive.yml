name: Render Keep Alive

on:
  schedule:
    # 매 10분마다 실행 (더 자주 핑하여 확실하게 방지)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: Keep Render Server Alive
      run: |
        RENDER_URL="${{ secrets.RENDER_URL }}"
        
        if [ -z "$RENDER_URL" ]; then
          echo "RENDER_URL이 설정되지 않았습니다."
          exit 1
        fi
        
        HEALTH_URL="${RENDER_URL}/health"
        echo "핑 시작: $HEALTH_URL"
        
        # 재시도 횟수와 대기 시간 설정
        MAX_RETRIES=3
        RETRY_WAIT=10
        SUCCESS=false
        
        for i in $(seq 1 $MAX_RETRIES); do
          echo "시도 $i/$MAX_RETRIES..."
          
          # 타임아웃 시간을 30초로 증가
          response=$(curl -s -w "%{http_code}" -o /dev/null "$HEALTH_URL" --max-time 30)
          
          if [ "$response" -ge 200 ] && [ "$response" -lt 500 ]; then
            echo "✅ 성공: HTTP $response - $(date)"
            SUCCESS=true
            break
          else
            echo "⚠️ 경고: HTTP $response - $(date)"
            
            if [ $i -lt $MAX_RETRIES ]; then
              echo "$RETRY_WAIT초 후 재시도합니다..."
              sleep $RETRY_WAIT
            fi
          fi
        done
        
        if [ "$SUCCESS" = false ]; then
          echo "❌ 실패: 최대 재시도 횟수($MAX_RETRIES)를 초과했습니다."
          # 워크플로우가 실패하지 않도록 exit 1을 주석 처리하거나 제거할 수 있습니다
          # exit 1
        else
          echo "서버가 성공적으로 활성화되었습니다."
        fi