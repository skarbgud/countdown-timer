# Server configuration
server.port=8088

# Oracle Database configuration
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=countdown
spring.datasource.password=countdown

# MyBatis configuration
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.timer.countdown.model
mybatis.mapper-locations=classpath:mappers/**/*.xml

# Logging for SQL
logging.level.jdbc.sqlonly=DEBUG
logging.level.jdbc.sqltiming=INFO
logging.level.jdbc.audit=WARN
logging.level.jdbc.resultset=ERROR
logging.level.jdbc.resultsettable=ERROR
logging.level.jdbc.connection=INFO

# Session configuration
server.servlet.session.timeout=120m
