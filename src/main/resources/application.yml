spring:
  profiles:
    active: local
  websocket:
    max-text-message-size: 8192
    max-binary-message-size: 64000
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 2048
  servlet:
    session:
      timeout: 120m

---
# Local 환경 (개발용)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/timer_db
    username: timer_user
    password: timer_password123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

logging:
  level:
    com.timer.countdown.mapper: DEBUG
    org.springframework.jdbc: DEBUG
    com.timer.countdown: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

server:
  port: 8088

---
# Docker 환경
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:timer_db}
    username: ${DB_USERNAME:timer_user}
    password: ${DB_PASSWORD:timer_password123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

logging:
  level:
    com.timer.countdown.mapper: INFO
    com.timer.countdown: INFO
    root: INFO
  file:
    name: /app/logs/timer-app.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8080

---
# Production 환경 (Render용)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DATABASE_URL:${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:timer_prod}}
    username: ${DB_USERNAME:countdown_prod}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10  # Render 무료 플랜에 맞게 조정
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000   # 5분으로 단축
      max-lifetime: 900000   # 15분으로 단축

# JAR 파일 로딩 최적화
spring.boot.loader:
  zip.disable-zip64-extra-field-validation: true

logging:
  level:
    com.timer.countdown: INFO
    root: WARN
    org.springframework.boot.loader: ERROR  # ZIP 관련 로그 억제
  file:
    name: /app/logs/timer-app.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: ${PORT:8080}  # Render가 제공하는 포트 사용
  shutdown: graceful # graceful shutdown으로 요청들어온건 처리하고 종료