version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-timer-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: timer_db
      MYSQL_USER: timer_user
      MYSQL_PASSWORD: timer_password123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "timer_user", "-ptimer_password123"]
      interval: 10s
      timeout: 5s
      retries: 5

  timer-app:
    build: .
    container_name: timer-spring-app
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: timer_db
      DB_USERNAME: timer_user
      DB_PASSWORD: timer_password123
    ports:
      - "8088:8080"
    volumes:
      - ./logs:/app/logs

volumes:
  mysql-data:
