version: '3.8'

services:
  postgres-db:
    image: postgres:15
    container_name: postgres-timer-db
    environment:
      POSTGRES_PASSWORD: timer_password123
      POSTGRES_DB: timer_db
      POSTGRES_USER: timer_user
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timer_user -d timer_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  timer-app:
    build: .
    container_name: timer-spring-app
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: timer_db
      DB_USERNAME: timer_user
      DB_PASSWORD: timer_password123
    ports:
      - "8088:8080"
    volumes:
      - ./logs:/app/logs

  frontend:
    build:
      context: ./src/main/resources/static/frontend
      dockerfile: Dockerfile
    container_name: timer-frontend
    ports:
      - "3000:3000"
    depends_on:
      - timer-app
    environment:
      - REACT_APP_API_URL=http://localhost:8088
    volumes:
      - ./src/main/resources/static/frontend/src:/app/src
      - ./src/main/resources/static/frontend/public:/app/public

volumes:
  postgres-data:
