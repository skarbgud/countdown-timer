version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-timer-db
    environment:
      ORACLE_RANDOM_PASSWORD: true
      ORACLE_DATABASE: XE
      ORACLE_USERNAME: timer_user
      ORACLE_PASSWORD: timer_password123
      APP_USER: timer_user
      APP_USER_PASSWORD: timer_password123
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init-scripts:/docker-entrypoint-initdb.d/startup
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5

  timer-app:
    build: .
    container_name: timer-spring-app
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: oracle-db
      DB_PORT: 1521
      DB_NAME: XE
      DB_USERNAME: timer_user
      DB_PASSWORD: timer_password123
    ports:
      - "8088:8088"
    volumes:
      - ./logs:/app/logs

volumes:
  oracle-data:
